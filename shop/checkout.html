<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주문/결제 - BASIC STREET</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Malgun Gothic",sans-serif;color:#111}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px}
h1{font-size:20px;margin:0 0 16px}
.summary{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid #eee;border-bottom:1px solid #eee;font-size:15px}
#agreement{margin-top:8px}
button{width:100%;margin-top:16px;padding:14px;font:inherit;font-size:16px;border:1px solid #111;border-radius:6px;background:#111;color:#fff;cursor:pointer}
button:disabled{opacity:.35;cursor:not-allowed}
</style>
</head>
<body>
<div class="wrap">
  <h1>주문 / 결제</h1>
  <div class="summary"><span id="orderName"></span><strong id="amountText"></strong></div>
  <div id="payment-method"></div>
  <div id="agreement"></div>
  <button id="payBtn" type="button" disabled>결제하기</button>
</div>

<script src="https://js.tosspayments.com/v2/standard"></script>
<script>
const CLIENT_KEY = 'test_ck_여기에_토스페이먼츠_클라이언트_키';

(async () => {
  const order = JSON.parse(sessionStorage.getItem('checkout') || 'null');
  if (!order) {
    location.replace('index.html');
    return;
  }

  document.getElementById('orderName').textContent = order.orderName;
  document.getElementById('amountText').textContent = order.amount.toLocaleString('ko-KR') + '원';

  const payBtn = document.getElementById('payBtn');
  const tossPayments = TossPayments(CLIENT_KEY);
  const widgets = tossPayments.widgets({ customerKey: TossPayments.ANONYMOUS });

  await widgets.setAmount({ currency: 'KRW', value: order.amount });
  await widgets.renderPaymentMethods({ selector: '#payment-method', variantKey: 'DEFAULT' });
  const agreement = await widgets.renderAgreement({ selector: '#agreement', variantKey: 'AGREEMENT' });
  agreement.on('agreementStatusChange', (status) => {
    payBtn.disabled = !status.agreedRequiredTerms;
  });

  payBtn.addEventListener('click', async () => {
    try {
      await widgets.requestPayment({
        orderId: 'ORD' + Date.now() + Math.random().toString(36).slice(2, 8),
        orderName: order.orderName,
        successUrl: window.location.origin + '/success.html',
        failUrl: window.location.origin + '/fail.html',
      });
    } catch (error) {
      alert(error.message || '결제 요청에 실패했습니다.');
    }
  });
})();
</script>
</body>
</html>
